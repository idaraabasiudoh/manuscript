<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Light by default; apply a saved dark choice before first paint (see src/lib/theme.ts).
      var t = 'light'
      try {
        if (localStorage.getItem('manuscript:theme') === 'dark') t = 'dark'
      } catch (e) {}
      document.documentElement.dataset.theme = t
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131314')
    </script>
    <meta name="description" content="Shared notebooks for video and short-film ideas — poetry, drama and prose." />
    <!-- Link previews (iMessage, WhatsApp, Slack, X…). Crawlers don't run JS, so these must be static. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manuscript" />
    <meta property="og:title" content="Manuscript — every idea, in one script" />
    <meta property="og:description" content="Write scenes, poems and stories, drop in references and rough cuts. Share projects with people to collab across the web." />
    <meta property="og:image" content="https://manuscript-studios.vercel.app/og.png?v=2" />
    <meta property="og:image:width" content="1200" />

    <meta property="og:image:alt" content="Manuscript — Every idea, in one script." />
