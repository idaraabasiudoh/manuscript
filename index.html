<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply a saved light/dark choice before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('manuscript:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        else t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131314')
      } catch (e) {}
    </script>
    <meta name="description" content="Shared notebooks for video and short-film ideas — poetry, drama and prose." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/full/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/full/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/full/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <title>Manuscript</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
